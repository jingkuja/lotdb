name: Release

# Push a tag such as v1.0.1 (matching the version in tauri.conf.json and
# package.json) to build a draft GitHub Release with the macOS DMG.
#
# Signing and notarization need these repository secrets (see
# docs/LotDB-技术架构与上线说明书.md, part 3 §6–7). Without them the job still runs, but the DMG is
# unsigned and Gatekeeper will block it on other Macs.
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                    Apple ID email
#   APPLE_PASSWORD              app-specific password
#   APPLE_TEAM_ID               10-character Team ID

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$app" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME, tauri.conf.json $app, package.json $pkg"
            exit 1
          fi

      - name: Quality gates
        run: |
          pnpm lint
          pnpm format:check
          npx tsc -b
          pnpm test

      # Tauri's build.rs needs the frontend dist
      - run: pnpm vite build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Report signing status
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::Apple signing secrets are not set; this build is unsigned and not notarized."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LotDB ${{ github.ref_name }}"
          releaseBody: |
            macOS 12+ / Apple Silicon
            备份/恢复需要本机安装 mysql-client 与 postgresql 客户端。
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin
